name: imaging-review-worklist

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: imaging
      POSTGRES_PASSWORD: imaging
      POSTGRES_DB: imaging
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
volumes:
  pgdata:
