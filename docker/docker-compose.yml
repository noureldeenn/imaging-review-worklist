name: imaging-review-worklist

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: imaging
      POSTGRES_PASSWORD: imaging
      POSTGRES_DB: imaging
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U imaging']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
volumes:
  pgdata:
