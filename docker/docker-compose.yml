name: imaging-review-worklist

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: imaging
      POSTGRES_PASSWORD: imaging
      POSTGRES_DB: imaging
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U imaging']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

  api:
    profiles: ['app']
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://imaging:imaging@postgres:5432/imaging
      WEB_ORIGIN: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/readyz']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    profiles: ['app']
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
